[package]
name = "f108-pro"
version = "0.1.0"
edition = "2021"
authors = ["fjorge"]
description = "Userspace driver and CLI utility for Aula F108 Pro mechanical keyboard in Rust"

[dependencies]
rusb = "0.9"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
chrono = "0.4"
image = { version = "0.24", default-features = false, features = ["gif", "png", "jpeg"] }
anyhow = "1.0"
thiserror = "1.0"

[[bin]]
name = "f108-pro"
path = "src/main.rs"

[[bin]]
name = "dumphid"
path = "src/tools/dumphid.rs"

[[bin]]
name = "mkimage"
path = "src/tools/mkimage.rs"

[lib]
name = "aula"
path = "src/lib.rs"
